<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Postbox ships LIGHT-ONLY (see src/styles.css's header for why the
         ported .dark palette is present but never applied), so there is one
         theme-color, not a light/dark pair: #ffffff is the sidebar and the
         mobile topbar, which is what sits under the browser chrome. -->
    <meta name="theme-color" content="#ffffff" />
    <!-- iOS: makes "Add to Home Screen" launch in the manifest's standalone
         display mode, which Web Push requires. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter, the family Plunk's design system is built on (its
         `--font-sans` in apps/web/src/styles/globals.css). Four weights:
         400 body, 500 nav/labels, 600 headings and unread senders, 700 the
         wordmark. Timestamps and classification tokens use Tailwind's
         `font-mono` stack (SF Mono / Menlo / Consolas), which needs no
         webfont. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>Postbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
