<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Static fallback only. The inline script right below overwrites this
         attribute before first paint, and src/themeController.ts keeps it
         in sync afterwards on every preference or OS change. Deliberately
         NOT a media="(prefers-color-scheme: ...)" pair of tags: those can
         only see the OS's own scheme, not an explicit in-app Light/Dark
         choice overriding it, so they would show the wrong browser-chrome
         colour the instant someone picked Dark on a light OS (or the
         reverse) — a static pair can't express "the app disagrees with the
         OS on purpose". #ffffff / #030711 are --background's light/dark
         values (src/styles.css), i.e. the same colour as the sidebar and
         mobile topbar sitting under this chrome. -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Applies the resolved theme's `.dark` class (and this tag's colour)
         BEFORE first paint, so a stored Dark preference — or System while
         the OS is dark — never flashes light and then swaps a moment
         later. An inline script is the only way to run before the module
         graph loads, which is the entire reason this exists outside
         src/themeController.ts: it duplicates that file's `resolveTheme`
         decision and class/meta application in plain, un-bundled JS.
         Deliberately tiny — this is not the place for the real logic,
         only for running an equivalent of it early. Keep the two in sync
         by hand if either changes; no test can see into an inline
         <script> to check for you. -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('postbox:theme');
        } catch (e) {
          // Storage disabled (private-mode Safari, a locked-down profile):
          // fall through to the OS preference below, same as "never set".
        }
        var isDark =
          stored === 'dark' ||
          (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', isDark ? '#030711' : '#ffffff');
      })();
    </script>
    <!-- iOS: makes "Add to Home Screen" launch in the manifest's standalone
         display mode, which Web Push requires.

         BOTH TAGS, not one. `mobile-web-app-capable` is the standard name
         and the only one Chrome reads; it warns in the console when it
         sees the `apple-` prefixed form alone. Safari on iOS reads only
         the `apple-` form, and iOS is the platform this app is actually
         installed on, so dropping it to silence the warning would break
         the installed launch mode outright. The migration path is to
         carry both, which is what this does. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter, the family Plunk's design system is built on (its
         `--font-sans` in apps/web/src/styles/globals.css). Four weights:
         400 body, 500 nav/labels, 600 headings and unread senders, 700 the
         wordmark. Timestamps and classification tokens use Tailwind's
         `font-mono` stack (SF Mono / Menlo / Consolas), which needs no
         webfont. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>Postbox</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
