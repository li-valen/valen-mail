[package]
name = "postbox-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Postbox — the macOS desktop shell for the Postbox mail client"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-proxy"] }
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
url = "2"

# A shell should not carry a debug-build penalty into the bundle, and the
# release profile is what `tauri build` uses.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
